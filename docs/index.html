<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sjineser">
  <title>Sjineser</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views/play.css">
  <link rel="stylesheet" href="css/views/about.css">
  <link rel="stylesheet" href="css/views/stats.css">
  <link rel="stylesheet" href="css/views/more.css">
  <link rel="stylesheet" href="css/sandbox.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="app-brand" href="#/play">
      <span class="app-logo" aria-hidden="true"></span>
      <span class="app-title" data-text="appName"></span>
    </a>
    <div class="app-actions">
      <button id="sync-badge" class="badge" type="button" hidden></button>
    </div>
  </header>
  <div id="sandbox-bar" class="sandbox-bar" hidden></div>
  <main id="view" class="app-main"></main>
  <nav class="tabbar">
    <a href="#/play" data-tab="play"></a>
    <a href="#/stats" data-tab="stats"></a>
    <a href="#/more" data-tab="more"></a>
  </nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
